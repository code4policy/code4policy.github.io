<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Zero Waste Boston: how to sign in</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#1e293b;line-height:1.55}
    .card{max-width:600px;width:100%;background:#fff;border-radius:12px;border-top:8px solid #b45309;
      padding:32px 32px 26px;box-shadow:0 10px 30px rgba(15,23,42,.12)}
    .kicker{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b45309}
    h1{margin:0 0 6px;font-size:28px;line-height:1.2;color:#0f172a}
    .blurb{margin:0 0 18px;color:#475569}
    .access{margin:0 0 18px;padding:14px 16px;background:#fff7e6;border-radius:8px;font-size:16px}
    h2{margin:0 0 8px;font-size:17px;color:#0f172a}
    ol{margin:0 0 20px;padding-left:22px}
    li{margin:0 0 8px}
    code{font-size:15px;background:#f1f5f9;padding:1px 5px;border-radius:4px}
    a.btn{display:block;text-align:center;padding:15px 18px;border-radius:8px;background:#0f172a;color:#fff;
      font-weight:700;font-size:17px;text-decoration:none}
    a.btn:hover,a.btn:focus-visible{background:#b45309;outline:3px solid #fcd34d;outline-offset:2px}
    .help{margin:16px 0 0;font-size:14px;color:#64748b}
    .help a{color:#92400e}
  </style>
</head>
<body>
  <main class="card">
    <h1>Zero Waste Boston</h1>
    <p class="blurb">A residential waste dashboard tracking Boston’s progress toward its 2030 zero waste targets.</p>
    <p class="access">Enter your <code>@boston.gov</code> or <code>@hks.harvard.edu</code> email address and click <strong>Send login code</strong>.</p>
    <a class="btn" href="https://c4p-zero-waste.pages.dev/index-districts.html">Continue to sign in</a>
  </main>
</body>
</html>
